context:
  name: apache-airflow-providers-microsoft-azure
  version: 15.2.1

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/apache_airflow_providers_microsoft_azure-${{ version }}.tar.gz
  sha256: db837222f69b1e1bb21bab0ad49aa0a8d912236f73b4812035d2620f36d4fcea

build:
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core ==4.1.0
  run:
    - python >=${{ python_min }}
    - apache-airflow >=2.11.0
    - apache-airflow-providers-common-compat >=1.21.0
    - adlfs >=2026.5.0
    - aiohttp >=3.14.0
    - azure-batch >=15.0.0
    - azure-ai-projects >=2.2.0
    - azure-cosmos >=4.15.0
    - azure-mgmt-cosmosdb >=9.9.0
    - azure-datalake-store >=1.0.1
    - azure-identity >=1.25.3
    - azure-keyvault-secrets >=4.10.0
    - azure-mgmt-datalake-store >=0.5.0
    - azure-mgmt-resource >=25.0.0
    - azure-storage-blob >=12.28.0
    - azure-mgmt-storage >=24.0.1
    - azure-storage-file-share >=12.24.0
    - azure-servicebus >=7.14.3
    - azure-synapse-spark >=0.7.0
    - azure-synapse-artifacts >=0.22.0
    - azure-storage-file-datalake >=12.23.0
    - azure-kusto-data >=4.1.0,!=5.0.0
    - azure-mgmt-datafactory >=10.0.0
    - azure-mgmt-containerregistry >=15.0.0
    - azure-mgmt-compute >=37.2.0
    - azure-mgmt-containerinstance >=10.1.0
    - msgraph-core >=1.3.3
    - msgraphfs >=0.3.0
    - microsoft-kiota-http >=1.9.4,<1.13.0
    - microsoft-kiota-serialization-json >=1.9.4
    - microsoft-kiota-serialization-text >=1.9.4
    - microsoft-kiota-abstractions >=1.9.4,<2.0.0
    - microsoft-kiota-authentication-azure >=1.9.4,<2.0.0
    - msal_extensions >=1.3.0

    # temporary constraint for pip check, missed in
    # https://github.com/conda-forge/azure-storage-file-share-feedstock/pull/14
    - azure-core >=1.38.3
tests:
  - python:
      imports:
        - airflow.providers.microsoft.azure
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  homepage: https://github.com/apache/airflow/
  summary: Provider package apache-airflow-providers-microsoft-azure for Apache Airflow
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  documentation: https://airflow.apache.org/docs/apache-airflow-providers-microsoft-azure/stable/index.html
  repository: https://github.com/apache/airflow/

extra:
  recipe-maintainers:
    - xylar
